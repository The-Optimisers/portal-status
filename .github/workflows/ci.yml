# GENERATED by agency-os-agents tools/ci_fleet_sync.cjs - do not edit here; edit ci/templates/ci.yml
# there and re-run the sync. The nightly fleet check fails if this file drifts from the template.
#
# Every push and pull request re-proves this repo on a fresh checkout with no laptop and no secrets:
#   1. the shared guards (secret scan, laptop-path ceiling, client-data guard, NOT RUN ceiling)
#   2. the repo's own tests, if .ci/ci.json names a test command
#   3. a Cloudflare Worker build that deploys nothing, if .ci/ci.json says the repo is a Worker
#   4. security scans (own job, always on Ubuntu): secrets across all history, vulnerable dependencies, code, SBOM
# Each step runs even when an earlier one failed, so one push shows every red at once.
name: ci
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4, pinned by sha 22-Nov-2026
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4, pinned by sha 22-Nov-2026
        with:
          node-version: "24"

      - name: Read this repo's CI settings
        id: cfg
        run: |
          node -e '
            const c = require("./.ci/ci.json");
            const out = require("fs").appendFileSync;
            const f = process.env.GITHUB_OUTPUT;
            out(f, "test=" + (c.test || "") + "\n");
            out(f, "worker=" + (c.worker ? "yes" : "no") + "\n");
            out(f, "wrangler=" + (c.wrangler || "4.130.0") + "\n");
            out(f, "notrun=" + (c.notRun || 0) + "\n");
            out(f, "notrunmax=" + (c.notRunMax || 0) + "\n");
          '

      - name: Guards (secrets, laptop paths, client data, NOT RUN)
        if: always()
        run: node .ci/ci_guards.cjs --not-run "${{ steps.cfg.outputs.notrun }}" --not-run-max "${{ steps.cfg.outputs.notrunmax }}"

      # 19-Nov-2026 (arch-fleet): the repo's declared architecture (.ci/architecture.json, generated from agency-os-agents
      # brain/manifests) held against its REAL wrangler config and code. NOT DECLARED and drift are advisory until the
      # ratchet date in that file, then they fail. UNKNOWN is printed, never read as a pass.
      - name: Architecture (declared vs real code)
        if: always()
        run: node .ci/arch_check.cjs

      - name: Tests
        if: always() && steps.cfg.outputs.test != ''
        run: ${{ steps.cfg.outputs.test }}

      - name: Worker build (dry run, deploys nothing)
        if: always() && steps.cfg.outputs.worker == 'yes'
        run: npx --yes "wrangler@${{ steps.cfg.outputs.wrangler }}" deploy --dry-run --outdir .ci-dist

  # 22-Nov-2026 (compliance-scan): the scan is its OWN job on Ubuntu for every repo. Repos whose check job runs on
  # windows-latest (cockpit-workspaces, live-automation-code, sem-pacing-ops, meta-ads-preview-tool) failed with the scan
  # inside it: PowerShell is the default shell there, and the scanners are Linux binaries (semgrep has no Windows build).
  # runs-on is written in ARRAY form on purpose: tools/ci_fleet_sync.cjs swaps only the check job's one-value runner
  # line for a row's runner (text match), so this job always stays on Ubuntu.
  security:
    runs-on: [ubuntu-latest]
    timeout-minutes: 45   # 22-Nov-2026: cockpit-workspaces (1,282 files, full history) was cancelled at 20; agency-os-agents takes 11
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4, pinned by sha 22-Nov-2026
        with:
          fetch-depth: 0   # the secret scan reads every commit, not only the last one
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4, pinned by sha 22-Nov-2026
        with:
          node-version: "24"

      # >>> security-scan (tools/check_security_scan_twin.cjs holds .github/workflows/security.yml in agency-os-agents to
      # this block byte for byte; edit here and copy there)
      # 22-Nov-2026 (compliance-scan lane; SOC 2 CC7.1, CC8.1; ISO 27001 A.8.8, A.8.28): every push scans for secrets in
      # ALL history, known-vulnerable dependencies and risky code, and keeps an SBOM as 90-day evidence.
      # Each tool is a pinned release whose sha256 is checked before it runs. A tool that cannot be fetched, fails its
      # checksum or errors is a FAIL on any date: a scanner that did not run is never read as clean.
      # FINDINGS are advisory until SCAN_RATCHET, then they fail. Move the date only in a commit that says why.
      # A false positive is triaged in a reviewed commit, with a reason: .gitleaksignore (fingerprint), osv-scanner.toml
      # ([[IgnoredVulns]] with reason and ignoreUntil), or a `nosemgrep: <rule>` comment on the line.
      - name: Security scan tools (pinned, checksum-verified)
        id: scantools
        if: always()
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/scantools"; mkdir -p "$T"; cd "$T"
          fetch() { curl -fsSL --retry 3 -o "$2" "$1"; echo "$3  $2" | sha256sum -c -; }
          fetch https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz gitleaks.tgz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          fetch https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 osv-scanner 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          fetch https://github.com/anchore/syft/releases/download/v1.56.0/syft_1.56.0_linux_amd64.tar.gz syft.tgz 1c2493cfcf52d3367d6cb25780d9190c111c2219c34c820574c43e8bae15c528
          tar -xzf gitleaks.tgz gitleaks
          tar -xzf syft.tgz syft
          chmod +x gitleaks osv-scanner syft
          pipx install --quiet "semgrep==1.184.0"
          echo "$T" >> "$GITHUB_PATH"

      - name: Security scans (secrets in history, dependencies, code, SBOM)
        if: always()
        env:
          SCAN_RATCHET: "2026-12-19"
          TOOLS_OK: ${{ steps.scantools.outcome }}
        run: |
          set +e -uo pipefail   # GitHub runs bash -e: without +e the first scanner that FINDS something ends the step before its result is read (measured 22-Nov, run 44946943840)
          O="$RUNNER_TEMP/scan-evidence"; mkdir -p "$O"
          broke=0; found=0
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$TOOLS_OK" != "success" ]; then say "FAIL   scanner tools did not install (see the step above); nothing was scanned"; exit 1; fi
          say "### Security scans ($(git rev-parse --short HEAD), $(git rev-list --count HEAD) commits)"

          # Secrets. The raw report holds the values, so it is written to a PRIVATE temp folder that is never uploaded; the
          # evidence copy has every value replaced by REDACTED. Triage is by literal shape checks (house rule: no regex):
          # a 17-char Airtable object ID, a 40/64-hex git sha or hash, an activity-log key (UPPER-...-YYYY-MM-DD), or
          # lowercase words. Only what none of those explain counts as a finding. A known test plant is ignored by its
          # gitleaks fingerprint in .gitleaksignore, with a reason, in a reviewed commit.
          P="$RUNNER_TEMP/scan-private"; mkdir -p "$P"; chmod 700 "$P"
          gitleaks git --no-banner --exit-code 2 --report-format json --report-path "$P/gitleaks.json" . > "$P/gitleaks.log" 2>&1; rc=$?
          if [ $rc -eq 0 ]; then say "PASS   secrets: no secret found in any commit"
          elif [ $rc -eq 2 ]; then
            node - "$P/gitleaks.json" "$O/gitleaks.json" > "$O/gitleaks-triage.txt" <<'TRIAGE'
          const fs = require("fs"); const [inp, out] = process.argv.slice(2);
          const rows = JSON.parse(fs.readFileSync(inp, "utf8"));
          const HEX = "0123456789abcdef", UP = "ABCDEFGHIJKLMNOPQRSTUVWXYZ", LO = "abcdefghijklmnopqrstuvwxyz", DIG = "0123456789";
          const AN = UP + LO + DIG, AT = ["tbl", "fld", "rec", "app", "viw", "wac", "wfl", "sel", "usr", "ent", "pag"];
          const all = (s, set) => s.length > 0 && [...s].every((c) => set.includes(c));
          function kind(s) {
            if (s.length === 17 && AT.includes(s.slice(0, 3)) && all(s, AN)) return "airtable-id";
            if ((s.length === 40 || s.length === 64) && all(s.toLowerCase(), HEX)) return "sha-or-hash";
            const p = s.split("-"), d = p.slice(-3), head = p.slice(0, -3);
            if (p.length >= 4 && d[0].length === 4 && d[1].length === 2 && d[2].length === 2 && d.every((x) => all(x, DIG))
                && all(head[0], UP) && head.every((x) => all(x, UP + DIG) || all(x, HEX))) return "log-key";
            const w = s.split("-").join("_").split("_").filter((x) => x.length);
            if (w.length && w.every((x) => all(x, LO))) return "lowercase-words";
            return "unexplained";
          }
          const counts = {}; const unexplained = [];
          const safe = rows.map((r) => {
            const k = kind(String(r.Secret || ""));
            counts[k] = (counts[k] || 0) + 1;
            const o = Object.assign({}, r, { Secret: "REDACTED", Match: "REDACTED", Line: "REDACTED", Triage: k });
            if (k === "unexplained") unexplained.push(o.RuleID + " " + o.File + ":" + o.StartLine + " " + String(o.Commit).slice(0, 8) + " fingerprint " + o.Fingerprint);
            return o;
          });
          fs.writeFileSync(out, JSON.stringify(safe, null, 1));
          console.log("total=" + rows.length + " " + Object.keys(counts).sort().map((k) => k + "=" + counts[k]).join(" "));
          unexplained.forEach((u) => console.log("UNEXPLAINED " + u));
          TRIAGE
            trc=$?
            if [ $trc -ne 0 ]; then broke=1; say "FAIL   secrets: the triage step could not run (exit $trc)"
            else
              u=$(grep -c '^UNEXPLAINED ' "$O/gitleaks-triage.txt"); summary=$(head -n 1 "$O/gitleaks-triage.txt")
              if [ "$u" -eq 0 ]; then say "PASS   secrets: every gitleaks hit is explained by shape ($summary)"
              else found=1; say "FIND   secrets: $u unexplained of $summary; values redacted (rotate first, then triage)"
                # The list itself, in the job log and the run summary, so triage needs no artifact download. Each line is
                # built by the triage script from rule, file:line, commit and fingerprint only, never the value. First 200.
                echo "UNEXPLAINED secret hits (rule file:line commit fingerprint; no values):"
                grep '^UNEXPLAINED ' "$O/gitleaks-triage.txt" | head -n 200
                { echo ""; echo "<details><summary>$u unexplained secret hits: rule, file:line, commit, fingerprint (no values)</summary>"; echo ""
                  echo '```'; grep '^UNEXPLAINED ' "$O/gitleaks-triage.txt" | head -n 200 | cut -c13-; echo '```'
                  [ "$u" -gt 200 ] && echo "... and $((u - 200)) more in the evidence artifact (gitleaks-triage.txt)"
                  echo "</details>"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else broke=1; say "FAIL   secrets: gitleaks exited $rc"; tail -n 5 "$P/gitleaks.log"; fi
          rm -rf "$P"

          osv-scanner scan source -r --format json --output-file "$O/osv.json" . > "$O/osv.log" 2>&1; rc=$?
          if [ $rc -eq 0 ]; then say "PASS   dependencies: no known vulnerability in any lockfile"
          elif [ $rc -eq 1 ]; then found=1; say "FIND   dependencies: $(node -e 'let n=0;for(const r of require(process.argv[1]).results||[])for(const p of r.packages||[])n+=(p.vulnerabilities||[]).length;console.log(n)' "$O/osv.json") known vulnerability record(s)"
          elif [ $rc -eq 128 ]; then say "NOT RUN dependencies: no lockfile in this repo, so nothing could be checked (not a pass)"
          else broke=1; say "FAIL   dependencies: osv-scanner exited $rc"; tail -n 20 "$O/osv.log"; fi

          semgrep scan --config p/default --metrics off --error --quiet --json --output "$O/semgrep.json" . > "$O/semgrep.log" 2>&1; rc=$?
          if [ $rc -eq 0 ]; then say "PASS   code: no finding from the p/default rules"
          elif [ $rc -eq 1 ]; then found=1; say "FIND   code: $(node -e 'console.log((require(process.argv[1]).results||[]).length)' "$O/semgrep.json") finding(s)"
          else broke=1; say "FAIL   code: semgrep exited $rc"; tail -n 20 "$O/semgrep.log"; fi

          if syft scan dir:. --quiet --output "cyclonedx-json=$O/sbom.cdx.json"; then say "PASS   sbom: $(node -e 'console.log((require(process.argv[1]).components||[]).length)' "$O/sbom.cdx.json") component(s) recorded"
          else broke=1; say "FAIL   sbom: syft could not build it"; fi

          if [ $broke -ne 0 ]; then say "**FAIL: a scanner did not run cleanly. A scan that did not run is never a pass.**"; exit 1; fi
          if [ $found -ne 0 ]; then
            if [[ "$(date -u +%F)" < "$SCAN_RATCHET" ]]; then say "**ADVISORY until $SCAN_RATCHET: findings above must be fixed or triaged before then, when they start failing.**"; exit 0; fi
            say "**FAIL: findings above (the ratchet date $SCAN_RATCHET has passed).**"; exit 1
          fi
          say "**All scans clean.**"

      - name: Keep scan evidence (90 days)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4, pinned by sha 22-Nov-2026
        with:
          name: security-scan-evidence
          path: ${{ runner.temp }}/scan-evidence
          retention-days: 90
          if-no-files-found: warn
      # <<< security-scan
